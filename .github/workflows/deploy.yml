name: 'Deploy Podcast Infrastructure'

# 1. When should this robot run? Every time you push to the 'main' branch.
on:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    
    steps:
    # 2. Download the latest code from your repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3. Install Terraform on the temporary GitHub server
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 4. Initialize Terraform (just like you did locally)
    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    # 5. Automatically apply the changes using the hidden AWS keys
    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}